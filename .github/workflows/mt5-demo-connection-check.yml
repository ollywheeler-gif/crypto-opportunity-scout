name: MT5 demo login check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mt5-demo-login:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check demo credentials are configured
        shell: pwsh
        env:
          MT5_DEMO_LOGIN: ${{ secrets.MT5_DEMO_LOGIN }}
          MT5_DEMO_PASSWORD: ${{ secrets.MT5_DEMO_PASSWORD }}
          MT5_DEMO_SERVER: ${{ secrets.MT5_DEMO_SERVER }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:MT5_DEMO_LOGIN) -or
              [string]::IsNullOrWhiteSpace($env:MT5_DEMO_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:MT5_DEMO_SERVER)) {
            throw 'Set MT5_DEMO_LOGIN, MT5_DEMO_PASSWORD and MT5_DEMO_SERVER in GitHub Actions secrets.'
          }
          if ($env:MT5_DEMO_LOGIN -notmatch '^\d+$') {
            throw 'MT5_DEMO_LOGIN must be the numeric demo account number.'
          }
          if ($env:MT5_DEMO_SERVER -cne 'ICMarketsSC-Demo') {
            throw 'MT5_DEMO_SERVER must exactly equal ICMarketsSC-Demo.'
          }
          'Demo credentials are present; values will not be printed.'

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $installDir = 'C:\MT5Demo'
          Invoke-WebRequest 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'MetaQuotes') {
            throw "MetaTrader installer signature validation failed: $($signature.Status)"
          }
          $process = Start-Process -FilePath $installer -ArgumentList ('/auto /path:"' + $installDir + '"') -Wait -PassThru
          $terminal = Join-Path $installDir 'terminal64.exe'
          if (-not (Test-Path $terminal)) {
            throw "MetaTrader installation failed (installer exit code $($process.ExitCode))."
          }
          "MT5_INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Start MT5 with demo account and verify login
        shell: pwsh
        env:
          MT5_DEMO_LOGIN: ${{ secrets.MT5_DEMO_LOGIN }}
          MT5_DEMO_PASSWORD: ${{ secrets.MT5_DEMO_PASSWORD }}
          MT5_DEMO_SERVER: ${{ secrets.MT5_DEMO_SERVER }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:MT5_INSTALL_DIR
          $config = Join-Path $env:RUNNER_TEMP 'mt5-demo-login.ini'
          $terminal = Join-Path $root 'terminal64.exe'
          $logs = Join-Path $root 'logs'

          # Keep credentials in a temporary config file, never in the repository or artifacts.
          $ini = @(
            '[Common]',
            # Select the broker server first, then supply the account credentials.
            ('Server=' + $env:MT5_DEMO_SERVER.Trim()),
            ('Login=' + $env:MT5_DEMO_LOGIN.Trim()),
            ('Password=' + $env:MT5_DEMO_PASSWORD),
            'KeepPrivate=1',
            '',
            '[StartUp]',
            'Symbol=EURUSD',
            'Period=M1'
          ) -join [Environment]::NewLine
          Set-Content -LiteralPath $config -Value $ini -Encoding Unicode

          # Remove credentials from this step's environment before starting MT5.
          Remove-Item Env:MT5_DEMO_LOGIN
          Remove-Item Env:MT5_DEMO_PASSWORD
          Remove-Item Env:MT5_DEMO_SERVER

          $process = $null
          try {
            $process = Start-Process -FilePath $terminal -ArgumentList ('/portable /config:"' + $config + '"') -PassThru
            $deadline = (Get-Date).AddMinutes(3)
            $loginEvidence = $false

            while ((Get-Date) -lt $deadline) {
              if (Test-Path $logs) {
                $recentLogs = @(Get-ChildItem -LiteralPath $logs -Filter '*.log' -File -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTime -Descending | Select-Object -First 3)
                foreach ($file in $recentLogs) {
                  $text = Get-Content -LiteralPath $file.FullName -Raw -ErrorAction SilentlyContinue
                  if ($text -match '(?i)authorized|authorization successful|connected to .*server') {
                    $loginEvidence = $true
                    break
                  }
                }
              }
              if ($loginEvidence) { break }
              if ($process.HasExited) {
                throw 'MetaTrader closed before a successful demo-login message was found in its logs.'
              }
              Start-Sleep -Seconds 5
            }

            if (-not $loginEvidence) {
              if (Test-Path $logs) {
                Get-ChildItem -LiteralPath $logs -Filter '*.log' -File -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTime -Descending | Select-Object -First 2 |
                  ForEach-Object {
                    'Recent MT5 log filename: ' + $_.Name
                    Get-Content -LiteralPath $_.FullName -Tail 30 -ErrorAction SilentlyContinue |
                      ForEach-Object { $_ -replace '(?i)(password|login)=\S+', '$1=[REDACTED]' }
                  }
              }
              throw 'No successful demo-login evidence was found within 3 minutes.'
            }

            'MT5 log contains a successful authorization/connection message.'
          }
          finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
            Remove-Item -LiteralPath $config -Force -ErrorAction SilentlyContinue
          }

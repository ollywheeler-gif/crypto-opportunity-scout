name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Find Cloudflare account and ensure KV namespace exists
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "\${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing GitHub Actions secret CLOUDFLARE_API_TOKEN" >&2
            exit 1
          fi

          accounts_json=$(curl --fail-with-body --silent --show-error \\
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \\
            "https://api.cloudflare.com/client/v4/accounts")
          account_id=$(echo "$accounts_json" | jq -r '.result[0].id // empty')
          if [ -z "$account_id" ]; then
            echo "Could not identify a Cloudflare account. Check token permissions." >&2
            echo "$accounts_json" | jq -c '{success,errors}'
            exit 1
          fi
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"

          namespaces_json=$(curl --fail-with-body --silent --show-error \\
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \\
            "https://api.cloudflare.com/client/v4/accounts/$account_id/storage/kv/namespaces")
          namespace_id=$(echo "$namespaces_json" | jq -r '.result[] | select(.title == "SCOUT_KV") | .id' | head -n 1 || true)

          if [ -z "$namespace_id" ]; then
            created=$(curl --fail-with-body --silent --show-error \\
              -X POST \\
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \\
              -H "Content-Type: application/json" \\
              --data '{"title":"SCOUT_KV"}' \\
              "https://api.cloudflare.com/client/v4/accounts/$account_id/storage/kv/namespaces")
            namespace_id=$(echo "$created" | jq -r '.result.id // empty')
          fi

          if [ -z "$namespace_id" ]; then
            echo "Could not find or create KV namespace SCOUT_KV. Check Workers KV Storage: Edit permission." >&2
            exit 1
          fi
          echo "namespace_id=$namespace_id" >> "$GITHUB_OUTPUT"

      - name: Configure KV binding for this deployment
        env:
          NAMESPACE_ID: \${{ steps.cloudflare.outputs.namespace_id }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("wrangler.toml")
          text = path.read_text()
          replacement = 'binding = "SCOUT_KV"\\nid = "' + os.environ["NAMESPACE_ID"] + '"'
          text, count = re.subn(r'(?m)^binding = "SCOUT_KV"\\s*$', lambda _: replacement, text, count=1)
          if count != 1:
              raise SystemExit("Could not locate the SCOUT_KV binding in wrangler.toml")
          path.write_text(text)
          PY

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ steps.cloudflare.outputs.account_id }}
        run: wrangler deploy

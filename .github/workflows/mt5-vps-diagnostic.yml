name: MT5 VPS diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    # Requires the Windows VPS to be registered as a self-hosted runner.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run MT5 and Python bootstrap diagnostic
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & "$env:GITHUB_WORKSPACE\scripts\vps\bootstrap-mt5-vps.ps1"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-vps-diagnostic-logs
          path: C:\MT5VPS\logs\
          if-no-files-found: warn
          retention-days: 7

name: MT5 EA compile (Windows)

concurrency:
  group: mt5-compile-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'mt5-trading-lab/mql5/Experts/**/*.mq5'
      - 'mt5-trading-lab/mql5/Scripts/**/*.mq5'
      - '.github/workflows/mt5-mql5-compile.yml'
  pull_request:
    paths:
      - 'mt5-trading-lab/mql5/Experts/**/*.mq5'
      - 'mt5-trading-lab/mql5/Scripts/**/*.mq5'
      - '.github/workflows/mt5-mql5-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download and verify official MT5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid') {
            throw "MT5 installer Authenticode signature is not valid: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notmatch 'MetaQuotes') {
            throw "Unexpected MT5 installer signer: $($signature.SignerCertificate.Subject)"
          }
          Write-Host "Verified installer signer: $($signature.SignerCertificate.Subject)"

      - name: Install MT5 without account setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $installDir = 'C:\MT5Compile'
          $argumentLine = '/auto /path:"' + $installDir + '"'
          $process = Start-Process -FilePath $installer -ArgumentList $argumentLine -Wait -PassThru
          $metaEditor = Join-Path $installDir 'metaeditor64.exe'
          $terminal = Join-Path $installDir 'terminal64.exe'
          if (-not (Test-Path $metaEditor -PathType Leaf) -or -not (Test-Path $terminal -PathType Leaf)) {
            throw "Expected MT5/MetaEditor files were not found under $installDir"
          }
          "MT5_INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $artifactDir = Join-Path $env:RUNNER_TEMP 'mt5-compile-evidence'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          "MT5_COMPILE_ARTIFACTS=$artifactDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Initialize isolated MQL5 include directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $terminal = Join-Path $env:MT5_INSTALL_DIR 'terminal64.exe'
          $portableMql5 = Join-Path $env:MT5_INSTALL_DIR 'MQL5'
          $tradeInclude = Join-Path $portableMql5 'Include\Trade\Trade.mqh'
          if (-not (Test-Path $tradeInclude -PathType Leaf)) {
            $terminalProcess = Start-Process -FilePath $terminal -ArgumentList '/portable' -PassThru
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline -and -not (Test-Path $tradeInclude -PathType Leaf)) {
              Start-Sleep -Seconds 2
            }
            if (-not $terminalProcess.HasExited) {
              Stop-Process -Id $terminalProcess.Id -Force
            }
          }
          if (-not (Test-Path $tradeInclude -PathType Leaf)) {
            throw 'Could not initialize a local MQL5 standard include directory; compile was not attempted.'
          }
          "MQL5_ROOT=$portableMql5" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile STRAT-001 time-series momentum EA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:MQL5_ROOT 'Experts\TradingLab\STRAT-001_TimeSeriesMomentum.mq5'
          New-Item -ItemType Directory -Force -Path (Split-Path $source -Parent) | Out-Null
          Copy-Item 'mt5-trading-lab/mql5/Experts/STRAT-001_TimeSeriesMomentum.mq5' $source -Force
          $ex5 = [System.IO.Path]::ChangeExtension($source, '.ex5')
          $log = [System.IO.Path]::ChangeExtension($source, '.log')
          Remove-Item $ex5,$log -Force -ErrorAction SilentlyContinue
          $metaEditor = Join-Path $env:MT5_INSTALL_DIR 'metaeditor64.exe'
          $compileArgs = @("/compile:`"$source`"", "/include:`"$env:MQL5_ROOT`"", '/log')
          $process = Start-Process -FilePath $metaEditor -ArgumentList $compileArgs -Wait -PassThru
          if (-not (Test-Path $log -PathType Leaf)) { throw "STRAT-001 compiler log missing (exit $($process.ExitCode))." }
          Copy-Item $log -Destination $env:MT5_COMPILE_ARTIFACTS -Force
          if (Test-Path $ex5 -PathType Leaf) { Copy-Item $ex5 -Destination $env:MT5_COMPILE_ARTIFACTS -Force }
          $logText = Get-Content $log -Raw
          $summary = [regex]::Match($logText, '(?im)^\s*Result:\s*(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if (-not $summary.Success -or [int]$summary.Groups[1].Value -ne 0 -or [int]$summary.Groups[2].Value -ne 0 -or -not (Test-Path $ex5 -PathType Leaf)) {
            throw 'STRAT-001 must compile with zero errors and zero warnings.'
          }
          $files = @($source,$ex5,$log) | ForEach-Object {
            [PSCustomObject]@{ file=[System.IO.Path]::GetFileName($_); bytes=(Get-Item $_).Length; sha256=(Get-FileHash $_ -Algorithm SHA256).Hash }
          }
          [PSCustomObject]@{
            status='COMPILED_ZERO_ERRORS_ZERO_WARNINGS'
            repository_commit=$env:GITHUB_SHA
            metaeditor_version=(Get-Item $metaEditor).VersionInfo.ProductVersion
            compile_summary=$summary.Value.Trim()
            files=$files
            note='Compile evidence only. No Strategy Tester run or performance claim.'
          } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $env:MT5_COMPILE_ARTIFACTS 'STRAT-001-compile-manifest.json') -Encoding UTF8

      - name: Compile STRAT-002 and retain logs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:MQL5_ROOT 'Experts\TradingLab\STRAT-002_DonchianBreakout.mq5'
          $sourceDir = Split-Path $source -Parent
          New-Item -ItemType Directory -Force -Path $sourceDir | Out-Null
          Copy-Item 'mt5-trading-lab/mql5/Experts/STRAT-002_DonchianBreakout.mq5' $source -Force
          $ex5 = [System.IO.Path]::ChangeExtension($source, '.ex5')
          $log = [System.IO.Path]::ChangeExtension($source, '.log')
          Remove-Item $ex5,$log -Force -ErrorAction SilentlyContinue
          $metaEditor = Join-Path $env:MT5_INSTALL_DIR 'metaeditor64.exe'
          $compileArgs = @("/compile:`"$source`"", "/include:`"$env:MQL5_ROOT`"", '/log')
          $compileProcess = Start-Process -FilePath $metaEditor -ArgumentList $compileArgs -Wait -PassThru
          $exitCode = $compileProcess.ExitCode
          if (-not (Test-Path $log -PathType Leaf)) {
            throw "MetaEditor produced no compiler log (exit code $exitCode)."
          }
          Copy-Item $log -Destination $env:MT5_COMPILE_ARTIFACTS -Force
          if (Test-Path $ex5 -PathType Leaf) { Copy-Item $ex5 -Destination $env:MT5_COMPILE_ARTIFACTS -Force }
          Get-Content $log
          $logText = Get-Content $log -Raw
          # MetaEditor may return a non-zero process exit code despite a successful compile.
          # Trust the fresh compiler summary and fresh EX5 together; retain the exit code for diagnosis.
          $summary = [regex]::Match($logText, '(?im)^\s*Result:\s*(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if (-not $summary.Success -or [int]$summary.Groups[1].Value -ne 0 -or -not (Test-Path $ex5 -PathType Leaf)) {
            throw "STRAT-002 compile failed or produced no fresh EX5 (MetaEditor exit code $exitCode)."
          }
          if ([int]$summary.Groups[2].Value -ne 0) {
            throw 'STRAT-002 compile produced warnings; review and resolve them before acceptance.'
          }
          $hashes = @($source, $ex5, $log) | ForEach-Object {
            $item = Get-Item -LiteralPath $_
            [PSCustomObject]@{
              file = [System.IO.Path]::GetFileName($item.FullName)
              bytes = $item.Length
              sha256 = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash
            }
          }
          $editorVersion = (Get-Item -LiteralPath $metaEditor).VersionInfo.ProductVersion
          $manifest = [PSCustomObject]@{
            status = 'COMPILED_ZERO_ERRORS_ZERO_WARNINGS'
            repository_commit = $env:GITHUB_SHA
            metaeditor_version = $editorVersion
            compile_summary = $summary.Value.Trim()
            metaeditor_process_exit_code = $exitCode
            files = $hashes
            note = 'Compile evidence only. No Strategy Tester run, broker validation or performance claim.'
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:MT5_COMPILE_ARTIFACTS 'compile-manifest.json') -Encoding UTF8
          Get-FileHash $source,$ex5,$log -Algorithm SHA256 | Format-Table -AutoSize

      - name: Compile STRAT-003 EMA trend EA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:MQL5_ROOT 'Experts\TradingLab\STRAT-003_EMATrend.mq5'
          New-Item -ItemType Directory -Force -Path (Split-Path $source -Parent) | Out-Null
          Copy-Item 'mt5-trading-lab/mql5/Experts/STRAT-003_EMATrend.mq5' $source -Force
          $ex5 = [System.IO.Path]::ChangeExtension($source, '.ex5')
          $log = [System.IO.Path]::ChangeExtension($source, '.log')
          Remove-Item $ex5,$log -Force -ErrorAction SilentlyContinue
          $metaEditor = Join-Path $env:MT5_INSTALL_DIR 'metaeditor64.exe'
          $compileArgs = @("/compile:`"$source`"", "/include:`"$env:MQL5_ROOT`"", '/log')
          $process = Start-Process -FilePath $metaEditor -ArgumentList $compileArgs -Wait -PassThru
          if (-not (Test-Path $log -PathType Leaf)) { throw "STRAT-003 compiler log missing (exit $($process.ExitCode))." }
          Copy-Item $log -Destination $env:MT5_COMPILE_ARTIFACTS -Force
          if (Test-Path $ex5 -PathType Leaf) { Copy-Item $ex5 -Destination $env:MT5_COMPILE_ARTIFACTS -Force }
          $logText = Get-Content $log -Raw
          $summary = [regex]::Match($logText, '(?im)^\s*Result:\s*(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if (-not $summary.Success -or [int]$summary.Groups[1].Value -ne 0 -or [int]$summary.Groups[2].Value -ne 0 -or -not (Test-Path $ex5 -PathType Leaf)) {
            throw 'STRAT-003 must compile with zero errors and zero warnings.'
          }
          $files = @($source,$ex5,$log) | ForEach-Object {
            [PSCustomObject]@{ file=[System.IO.Path]::GetFileName($_); bytes=(Get-Item $_).Length; sha256=(Get-FileHash $_ -Algorithm SHA256).Hash }
          }
          [PSCustomObject]@{
            status='COMPILED_ZERO_ERRORS_ZERO_WARNINGS'
            repository_commit=$env:GITHUB_SHA
            metaeditor_version=(Get-Item $metaEditor).VersionInfo.ProductVersion
            compile_summary=$summary.Value.Trim()
            files=$files
            note='Compile evidence only. No Strategy Tester run or performance claim.'
          } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $env:MT5_COMPILE_ARTIFACTS 'STRAT-003-compile-manifest.json') -Encoding UTF8

      - name: Compile non-trading symbol contract exporter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:MQL5_ROOT 'Scripts\TradingLab\ExportSymbolContract.mq5'
          New-Item -ItemType Directory -Force -Path (Split-Path $source -Parent) | Out-Null
          Copy-Item 'mt5-trading-lab/mql5/Scripts/TradingLab/ExportSymbolContract.mq5' $source -Force
          $ex5 = [System.IO.Path]::ChangeExtension($source, '.ex5')
          $log = [System.IO.Path]::ChangeExtension($source, '.log')
          Remove-Item $ex5,$log -Force -ErrorAction SilentlyContinue
          $metaEditor = Join-Path $env:MT5_INSTALL_DIR 'metaeditor64.exe'
          $compileArgs = @('/compile:"' + $source + '"', '/include:"' + $env:MQL5_ROOT + '"', '/log')
          $process = Start-Process -FilePath $metaEditor -ArgumentList $compileArgs -Wait -PassThru
          if (-not (Test-Path $log -PathType Leaf)) { throw "Contract exporter compiler log missing (exit $($process.ExitCode))." }
          Copy-Item $log -Destination $env:MT5_COMPILE_ARTIFACTS -Force
          if (Test-Path $ex5 -PathType Leaf) { Copy-Item $ex5 -Destination $env:MT5_COMPILE_ARTIFACTS -Force }
          $logText = Get-Content $log -Raw
          $summary = [regex]::Match($logText, '(?im)^\s*Result:\s*(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if (-not $summary.Success -or [int]$summary.Groups[1].Value -ne 0 -or [int]$summary.Groups[2].Value -ne 0 -or -not (Test-Path $ex5 -PathType Leaf)) {
            throw 'Symbol contract exporter must compile with zero errors and zero warnings.'
          }
          $files = @($source,$ex5,$log) | ForEach-Object {
            [PSCustomObject]@{ file=[System.IO.Path]::GetFileName($_); bytes=(Get-Item $_).Length; sha256=(Get-FileHash $_ -Algorithm SHA256).Hash }
          }
          [PSCustomObject]@{
            status='COMPILED_ZERO_ERRORS_ZERO_WARNINGS'
            repository_commit=$env:GITHUB_SHA
            metaeditor_version=(Get-Item $metaEditor).VersionInfo.ProductVersion
            compile_summary=$summary.Value.Trim()
            files=$files
            note='Non-trading symbol metadata exporter only; it was not executed and no broker metadata was captured.'
          } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $env:MT5_COMPILE_ARTIFACTS 'symbol-contract-exporter-manifest.json') -Encoding UTF8

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-compile-evidence
          path: |
            ${{ runner.temp }}/mt5-compile-evidence/**
          if-no-files-found: warn
          retention-days: 30
